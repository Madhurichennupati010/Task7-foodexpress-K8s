apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend
  namespace: foodexpress

spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
      - name: backend
        image: madhu934652/food-express-backend:latest
        imagePullPolicy: Always

        ports:
        - containerPort: 5000

        env:
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: foodexpress-config
              key: DB_HOST

        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: foodexpress-config
              key: DB_PORT

        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: foodexpress-config
              key: DB_NAME

        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: foodexpress-config
              key: NODE_ENV

        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: foodexpress-config
              key: PORT

        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: foodexpress-secret
              key: DB_USER

        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: foodexpress-secret
              key: DB_PASSWORD

        resources:
          requests:
            cpu: "200m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"

        livenessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 15

        readinessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 10