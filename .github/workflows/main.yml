name: Deploy FoodExpress to Minikube

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |

            cd ~/Task7-foodexpress-K8s

            git pull origin main

            # Start Minikube if not running
            minikube status || minikube start --driver=docker

            # Enable required addons
            minikube addons enable ingress
            minikube addons enable metrics-server
            minikube addons enable storage-provisioner
            minikube addons enable default-storageclass

            # Pull latest Docker images
            docker pull madhu934652/food-express-backend:latest
            docker pull madhu934652/food-express-frontend:latest

            # Deploy Kubernetes resources
            kubectl apply -f kubernetes/

            # Restart deployments
            kubectl rollout restart deployment backend -n foodexpress
            kubectl rollout restart deployment frontend -n foodexpress

            # Wait for deployments
            kubectl rollout status deployment/backend -n foodexpress
            kubectl rollout status deployment/frontend -n foodexpress
            kubectl rollout status deployment/mysql -n foodexpress

            echo "========== PODS =========="
            kubectl get pods -n foodexpress

            echo "========== SERVICES =========="
            kubectl get svc -n foodexpress

            echo "========== PVC =========="
            kubectl get pvc -n foodexpress

            echo "========== PV =========="
            kubectl get pv

            echo "========== HPA =========="
            kubectl get hpa -n foodexpress

            echo "========== INGRESS =========="
            kubectl get ingress -n foodexpress
